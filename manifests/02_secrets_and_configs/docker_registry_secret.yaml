---
# Docker Registry Credentials Secret (imagePullSecret)
# Type: kubernetes.io/dockerconfigjson
# Used by Kubelet to pull private container images from Docker Hub, GHCR, Quay, or AWS ECR.
#
# HOW TO GENERATE REAL CREDENTIALS:
# kubectl create secret docker-registry dockerhub-registry-secret \
#   --docker-server=https://index.docker.io/v1/ \
#   --docker-username=YOUR_DOCKERHUB_USERNAME \
#   --docker-password=YOUR_DOCKERHUB_TOKEN_OR_PASSWORD \
#   --docker-email=your-email@example.com \
#   --namespace=production \
#   --dry-run=client -o yaml > docker_registry_secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: dockerhub-registry-secret
  namespace: production
  labels:
    type: image-pull-secret
type: kubernetes.io/dockerconfigjson
# stringData allows writing un-base64-encoded JSON; Kubernetes base64-encodes it automatically
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "https://index.docker.io/v1/": {
          "username": "your_dockerhub_user",
          "password": "your_dockerhub_personal_access_token",
          "email": "devops@example.com",
          "auth": "eW91cl9kb2NrZXJodWJfdXNlcjp5b3VyX2RvY2tlcmh1Yl9wZXJzb25hbF9hY2Nlc3NfdG9rZW4="
        },
        "ghcr.io": {
          "username": "your_github_user",
          "password": "ghp_yourPersonalAccessToken123",
          "email": "devops@example.com",
          "auth": "eW91cl9naXRodWJfdXNlcjpnaHBfeW91clBlcnNvbmFsQWNjZXNzVG9rZW4xMjM="
        }
      }
    }
---
# Replicate imagePullSecret for staging namespace
apiVersion: v1
kind: Secret
metadata:
  name: dockerhub-registry-secret
  namespace: staging
  labels:
    type: image-pull-secret
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "https://index.docker.io/v1/": {
          "username": "your_dockerhub_user",
          "password": "your_dockerhub_personal_access_token",
          "email": "devops@example.com",
          "auth": "eW91cl9kb2NrZXJodWJfdXNlcjp5b3VyX2RvY2tlcmh1Yl9wZXJzb25hbF9hY2Nlc3NfdG9rZW4="
        }
      }
    }
