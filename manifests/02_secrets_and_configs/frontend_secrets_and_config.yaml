---
# Frontend Non-Sensitive Runtime Configuration (ConfigMap)
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: production
  labels:
    app.kubernetes.io/part-of: frontend
data:
  # Application Environment
  NODE_ENV: "production"
  APP_TITLE: "RKE2 Production Enterprise App"
  
  # Internal and External API Endpoints
  API_BASE_URL: "https://api.example.local/v1"
  ENABLE_ANALYTICS: "true"
  FEATURE_FLAG_DARK_MODE: "true"
  LOG_LEVEL: "info"

  # NGINX Reverse Proxy embedded configuration (if mounting into NGINX sidecar/container)
  nginx.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://hello-web-svc.production.svc.cluster.local:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health probe endpoint
        location /healthz {
            access_log off;
            return 200 "healthy\n";
        }
    }
---
# Frontend Sensitive Keys (Secret)
apiVersion: v1
kind: Secret
metadata:
  name: frontend-secrets
  namespace: production
  labels:
    app.kubernetes.io/part-of: frontend
type: Opaque
stringData:
  SENTRY_DSN: "https://public_key@sentry.io/1234567"
  NEXTAUTH_SECRET: "super-secret-nextauth-encryption-hash-key"
  GOOGLE_ANALYTICS_KEY: "G-REPLACE_WITH_REAL_TRACKING_ID"
