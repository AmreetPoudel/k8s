---
# Backend & Database Secrets (Opaque)
# Contains sensitive credentials for MySQL and backend microservices
#
# Production Security Practice:
# In real production, inject these via Vault/ExternalSecretsOperator or SealedSecrets.
# stringData allows human-readable definitions that Kubernetes base64 encodes on apply.

apiVersion: v1
kind: Secret
metadata:
  name: backend-database-secret
  namespace: production
  labels:
    app.kubernetes.io/part-of: backend
type: Opaque
stringData:
  # MySQL Root Password
  MYSQL_ROOT_PASSWORD: "SuperSecureRootPassword2026!#%"
  
  # Application User Credentials
  MYSQL_DATABASE: "appdb"
  MYSQL_USER: "app_service_user"
  MYSQL_PASSWORD: "AppUserSecretPassword987&*"

  # Full Connection String for Backend Services
  DATABASE_URL: "mysql://app_service_user:AppUserSecretPassword987&*@mysql.production.svc.cluster.local:3306/appdb"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-api-secret
  namespace: production
  labels:
    app.kubernetes.io/part-of: backend
type: Opaque
stringData:
  # Application Encryption & JWT Keys
  JWT_SECRET: "k8s-rke2-super-secret-jwt-signing-key-32bytes-min"
  API_ENCRYPTION_KEY: "aes256-gcm-random-encryption-key-here"

  # Third-Party API Integrations
  REDIS_PASSWORD: "RedisClusterAuthPassword456"
  STRIPE_SECRET_KEY: "sk_live_replaceWithRealStripeKeyInProd"
  AWS_ACCESS_KEY_ID: "AKIA_REPLACE_WITH_IAM_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "wJalrXUtnFEMI_REPLACE_WITH_IAM_SECRET"
