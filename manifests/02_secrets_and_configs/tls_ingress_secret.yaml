---
# Ingress TLS Certificate Secret
# Type: kubernetes.io/tls
# Used by NGINX Ingress Controller to terminate HTTPS traffic for domains.
#
# HOW TO GENERATE A PRODUCTION SELF-SIGNED CERT FOR TESTING:
# openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#   -keyout tls.key \
#   -out tls.crt \
#   -subj "/CN=app.example.local/O=Enterprise"
#
# kubectl create secret tls app-tls-cert \
#   --cert=tls.crt \
#   --key=tls.key \
#   --namespace=production \
#   --dry-run=client -o yaml > tls_ingress_secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: app-tls-cert
  namespace: production
  labels:
    type: ingress-tls
type: kubernetes.io/tls
stringData:
  # Self-signed demo certificate valid for app.example.local
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    MIIDBjCCAe4CCQDU6...[REPLACE_WITH_REAL_CRT_OR_USE_CERT_MANAGER]...
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN RSA PRIVATE KEY-----
    MIIEowIBAAKCAQEA...[REPLACE_WITH_REAL_PRIVATE_KEY]...
    -----END RSA PRIVATE KEY-----
