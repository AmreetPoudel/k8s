apiVersion: v1
kind: ConfigMap
metadata:
  name: microservices-config
  namespace: microservices
data:
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_QUEUE_NAME: "task_queue"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "taskdb"
  DB_USER: "postgres"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: microservices
  labels:
    app: backend-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
      - name: backend
        # In production CI/CD, the GitOps sync job updates this tag automatically:
        image: ghcr.io/amreetpoudel/backend:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: microservices-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: microservices-secrets
              key: db-password
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: microservices
  labels:
    app: backend-api
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  selector:
    app: backend-api
