apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dockerhub-pull-secret
  namespace: microservices
  labels:
    app.kubernetes.io/part-of: task-suite
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: dockerhub-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"https://index.docker.io/v1/":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}'
  data:
  - secretKey: username
    remoteRef:
      key: /order-platform/dockerhub-username
  - secretKey: token
    remoteRef:
      key: /order-platform/dockerhub-token
