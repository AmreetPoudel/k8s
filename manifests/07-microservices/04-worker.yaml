apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: microservices
  labels:
    app: worker
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      imagePullSecrets:
      - name: dockerhub-pull-secret
      containers:
      - name: worker
        # In production CI/CD, the GitOps sync job updates this tag automatically with SemVer:
        image: amreetpoudel/worker:v1.0.0
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: microservices-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: microservices-secrets
              key: db-password
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
