apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-arp-advertisement
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  ipAddressPools:
    - production-public-pool
  nodeSelectors:
    - matchLabels:
        node-role.kubernetes.io/worker: worker
