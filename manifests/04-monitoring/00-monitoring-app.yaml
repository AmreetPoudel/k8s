apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.5.0
    helm:
      values: |
        prometheus:
          prometheusSpec:
            retention: 15d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn-replicated
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi
            nodeSelector:
              node-role.kubernetes.io/worker: worker
        
        grafana:
          adminPassword: "AdminSecurePassword2026!#"
          persistence:
            enabled: true
            storageClassName: longhorn-replicated
            accessModes: ["ReadWriteOnce"]
            size: 5Gi
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - grafana.internal.local
          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://logging-stack-loki.logging.svc.cluster.local:3100
              isDefault: false
              jsonData:
                maxLines: 1000
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: 'default'
                  orgId: 1
                  folder: ''
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/default
          dashboards:
            default:
              k8s-loki-logs:
                gnetId: 18494
                revision: 1
                datasource: Loki
              k8s-logs-events:
                gnetId: 15141
                revision: 1
                datasource: Loki
          nodeSelector:
            node-role.kubernetes.io/worker: worker

        alertmanager:
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn-replicated
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 2Gi
            nodeSelector:
              node-role.kubernetes.io/worker: worker

        nodeExporter:
          enabled: true

        kubeStateMetrics:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
