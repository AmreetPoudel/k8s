apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-smoke-test-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-replicated
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: storage-smoke-test-job
  namespace: default
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: storage-validator
        image: busybox:latest
        command:
          - "sh"
          - "-c"
          - |
            set -e
            echo "1. Writing verification payload to Longhorn Volume..."
            echo "STORAGE_PAYLOAD_VERIFIED_$(date +%s)" > /mnt/data/verification.txt
            
            echo "2. Reading payload back from disk..."
            cat /mnt/data/verification.txt
            
            echo "3. SUCCESS: Dynamic PVC provisioning, iSCSI mounting, and 3-way replicated I/O verified!"
        volumeMounts:
        - name: persistent-storage
          mountPath: /mnt/data
      volumes:
      - name: persistent-storage
        persistentVolumeClaim:
          claimName: storage-smoke-test-pvc
