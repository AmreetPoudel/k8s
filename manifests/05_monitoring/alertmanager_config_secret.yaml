---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-prometheus-kube-prometheus-stack-alertmanager
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
      slack_api_url: 'https://hooks.slack.com/services/REPLACE/WITH/YOUR_WEBHOOK'

    route:
      group_by: ['alertname', 'namespace', 'job']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'slack-default'
      routes:
        - match:
            severity: critical
          receiver: 'slack-critical'
          repeat_interval: 1h

    receivers:
      - name: 'slack-default'
        slack_configs:
          - channel: '#k8s-alerts'
            send_resolved: true
            text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}"

      - name: 'slack-critical'
        slack_configs:
          - channel: '#k8s-critical'
            send_resolved: true
            title: "🚨 CRITICAL: {{ .CommonLabels.alertname }}"
            text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}"
