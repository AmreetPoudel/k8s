---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rke2-critical-cluster-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: rke2.cluster.rules
      rules:
        # Node Offline Alert
        - alert: NodeOffline
          expr: up{job="node-exporter"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.instance }} is unreachable"
            description: "Node exporter on {{ $labels.instance }} has been down for over 2 minutes."

        # etcd Leader Absence
        - alert: EtcdNoLeader
          expr: sum(etcd_server_is_leader) == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "etcd cluster has no elected leader"
            description: "No etcd instance reports being leader. Control plane writes are failing."

        # etcd fsync latency spike
        - alert: EtcdHighFsyncLatency
          expr: histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m])) > 0.015
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "etcd WAL fsync latency is high (>15ms)"
            description: "Disk I/O latency on etcd master {{ $labels.instance }} exceeds 15ms p99."

        # Pod CrashLooping
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 > 0.2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is restart looping"
            description: "Container {{ $labels.container }} restarted more than 3 times in 15 minutes."

        # Kubelet Certificate Expiry
        - alert: ClientCertExpiringSoon
          expr: apiserver_client_certificate_expiration_seconds_bucket{le="2592000"} > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Kubernetes client certificates expire in < 30 days"
            description: "Cluster TLS certificates must be rotated."
