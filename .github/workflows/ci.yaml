name: Microservices CI/CD Pipeline & SemVer GitOps Release

on:
  push:
    branches:
      - main
    paths:
      - 'app/backend/**'
      - 'app/worker/**'
      - 'app/frontend/**'

  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Semantic Version Bump Type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch   # Bugfix (e.g. v1.0.0 -> v1.0.1)
          - minor   # New Feature (e.g. v1.0.0 -> v1.1.0)
          - major   # Breaking Change (e.g. v1.0.0 -> v2.0.0)

env:
  REGISTRY: docker.io
  DOCKERHUB_USERNAME: aamreet

jobs:
  # ============================================================================
  # JOB 1: Consolidated Prepare (Lint, Test, & Calculate SemVer in ONE single VM)
  # ============================================================================
  prepare:
    name: Lint, Test & Calculate SemVer
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.semver.outputs.new_version }}
      short_sha: ${{ steps.semver.outputs.short_sha }}
      old_current: ${{ steps.semver.outputs.old_current }}
      old_previous: ${{ steps.semver.outputs.old_previous }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Lint Backend Code
        run: |
          flake8 app/backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Compute Next SemVer from releases.yaml
        id: semver
        run: |
          RELEASES_FILE="manifests/07-microservices/releases.yaml"
          CURRENT_VER=$(grep '^current:' "$RELEASES_FILE" | awk '{print $2}' | tr -d '"')
          PREVIOUS_VER=$(grep '^previous:' "$RELEASES_FILE" | awk '{print $2}' | tr -d '"')

          BUMP_TYPE="${{ github.event.inputs.bump_type || 'patch' }}"

          # Strip leading 'v'
          CLEAN_VER="${CURRENT_VER#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VER"

          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          if [ "$BUMP_TYPE" = "major" ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [ "$BUMP_TYPE" = "minor" ]; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VER="v${MAJOR}.${MINOR}.${PATCH}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          echo "🚀 Calculated Next SemVer ($BUMP_TYPE): $CURRENT_VER -> $NEW_VER"
          echo "new_version=$NEW_VER" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "old_current=$CURRENT_VER" >> $GITHUB_OUTPUT
          echo "old_previous=$PREVIOUS_VER" >> $GITHUB_OUTPUT

  # ============================================================================
  # JOB 2: Build & Push Images in Parallel (Backend, Worker, Frontend)
  # ============================================================================
  build-and-push:
    name: Build Multi-Stage Docker Images
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [backend, worker, frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.new_version }}
            type=raw,value=sha-${{ needs.prepare.outputs.short_sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      # ⚡ HIGH-SPEED CACHING: GitHub Actions Cache prevents wheel re-compilation
      - name: Build and Push Docker Image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: ./app/${{ matrix.service }}
          file: ./app/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Security Scanning with Aqua Trivy
      - name: Scan Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ needs.prepare.outputs.new_version }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ============================================================================
  # JOB 3: GitOps Release & Sliding Window Matrix Rotator
  # ============================================================================
  gitops-sync:
    name: Sync SemVer & Rotate Sliding Window in GitOps
    needs: [prepare, build-and-push]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout GitOps Manifests Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/k8s
          token: ${{ secrets.GITOPS_SYNC_PAT }}
          ref: main

      - name: Update Deployment Image Tags & Rotate 3-Version Sliding Window
        run: |
          NEW_VER="${{ needs.prepare.outputs.new_version }}"
          OLD_CUR="${{ needs.prepare.outputs.old_current }}"
          OLD_PREV="${{ needs.prepare.outputs.old_previous }}"
          NOW_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RELEASES_FILE="manifests/07-microservices/releases.yaml"

          echo "🚀 Deploying SemVer Release: $NEW_VER"

          # 1. Update Kubernetes deployment image tags
          sed -i -E "s|image: .*/backend:.*|image: ${{ env.DOCKERHUB_USERNAME }}/backend:${NEW_VER}|g" manifests/07-microservices/03-backend.yaml
          sed -i -E "s|image: .*/worker:.*|image: ${{ env.DOCKERHUB_USERNAME }}/worker:${NEW_VER}|g" manifests/07-microservices/04-worker.yaml
          sed -i -E "s|image: .*/frontend:.*|image: ${{ env.DOCKERHUB_USERNAME }}/frontend:${NEW_VER}|g" manifests/07-microservices/05-frontend.yaml

          # 2. Slide the 3-Version Matrix:
          sed -i "s|^fallback:.*|fallback: \"${OLD_PREV}\"|g" "$RELEASES_FILE"
          sed -i "s|^previous:.*|previous: \"${OLD_CUR}\"|g" "$RELEASES_FILE"
          sed -i "s|^current:.*|current: \"${NEW_VER}\"|g" "$RELEASES_FILE"
          sed -i "s|^updated_at:.*|updated_at: \"${NOW_UTC}\"|g" "$RELEASES_FILE"
          sed -i "s|^last_action:.*|last_action: \"RELEASE_${NEW_VER}\"|g" "$RELEASES_FILE"

          cat "$RELEASES_FILE"

      - name: Commit and Push Release to GitOps
        run: |
          NEW_VER="${{ needs.prepare.outputs.new_version }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/07-microservices/
          git diff-index --quiet HEAD || git commit -m "ci(release): deploy ${NEW_VER} (sliding window rotated) [skip ci]"
          git push origin main
