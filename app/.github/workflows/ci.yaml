name: Microservices CI/CD Pipeline & GitOps Tag Sync

on:
  push:
    branches:
      - main
    paths:
      # Only trigger build if actual application source code changed
      - 'app/backend/**'
      - 'app/worker/**'
      - 'app/frontend/**'
    paths-ignore:
      # ⚡ ANTI-MEME FILTER: Never trigger rebuilds for markdown, docs, or typos in comments!
      - '**.md'
      - 'docs/**'
      - 'manifests/**'
      - '.gitignore'

  # Manual Dispatch: Enables rollback or on-demand builds directly from GitHub UI!
  workflow_dispatch:
    inputs:
      service_to_build:
        description: 'Target Service'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - worker
          - frontend
      gitops_auto_sync:
        description: 'Auto-update GitOps Manifests Repo?'
        type: boolean
        default: true

env:
  REGISTRY: docker.io
  DOCKERHUB_USERNAME: amreetpoudel

jobs:
  # ============================================================================
  # JOB 1: Test & Lint Code
  # ============================================================================
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting & Test Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Lint Backend Code
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 app/backend --count --select=E9,F63,F7,F82 --show-source --statistics

  # ============================================================================
  # JOB 2: Build & Push Hardened Multi-Stage Docker Images with Layer Caching
  # ============================================================================
  build-and-push:
    name: Build Multi-Stage Docker Images
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, worker, frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # ⚡ HIGH-SPEED CACHING: GitHub Actions Cache prevents wheel re-compilation
      - name: Build and Push Docker Image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: ./app/${{ matrix.service }}
          file: ./app/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Security Scanning with Aqua Trivy (Fails pipeline if Critical CVEs found)
      - name: Scan Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}:sha-${{ github.sha }}
          format: 'table'
          exit-code: '0' # Set to 1 in strict prod to block deployment on criticals
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ============================================================================
  # JOB 3: Cross-Repository GitOps Image Tag Updater
  # ============================================================================
  gitops-sync:
    name: Sync Image Tags to GitOps Manifests Repo
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout GitOps Manifests Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/k8s # Target infra repo
          token: ${{ secrets.GITOPS_SYNC_PAT }}
          ref: main

      - name: Update Deployment Image Tags
        run: |
          NEW_TAG="sha-${{ github.sha }}"
          echo "Updating GitOps manifests to image tag: $NEW_TAG for Docker Hub user: ${{ env.DOCKERHUB_USERNAME }}"

          # Update backend deployment image tag
          sed -i "s|image: .*/backend:.*|image: ${{ env.DOCKERHUB_USERNAME }}/backend:${NEW_TAG}|g" manifests/07-microservices/03-backend.yaml

          # Update worker deployment image tag
          sed -i "s|image: .*/worker:.*|image: ${{ env.DOCKERHUB_USERNAME }}/worker:${NEW_TAG}|g" manifests/07-microservices/04-worker.yaml

          # Update frontend deployment image tag
          sed -i "s|image: .*/frontend:.*|image: ${{ env.DOCKERHUB_USERNAME }}/frontend:${NEW_TAG}|g" manifests/07-microservices/05-frontend.yaml

      - name: Commit and Push Image Tag Updates to GitOps
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/07-microservices/
          git diff-index --quiet HEAD || git commit -m "ci(gitops): deploy microservices release sha-${{ github.sha }} [skip ci]"
          git push origin main
